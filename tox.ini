[tox]
# `tox` with no args runs the full pre-PR suite. CI workflows invoke
# individual env names directly. Integ-* envs are added in the PRs
# that ship their respective test tiers.
envlist = clean,linters,docs,unit-tests


[testenv]
parallel_show_output = true
package = wheel
wheel_build_env = .pkg


[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase


# `tox -e linters` rewrites formatting in place and runs checks.
[testenv:linters]
basepython = python3
skip_install = true
list_dependencies_command = echo
deps =
    {[testenv:ruff-format]deps}
    {[testenv:ruff-check]deps}
    {[testenv:version-sync]deps}
commands =
    {[testenv:ruff-format]commands}
    {[testenv:ruff-check]commands}
    {[testenv:version-sync]commands}

# `tox -e linters-check` is read-only — used in CI.
[testenv:linters-check]
basepython = python3
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff check python test scripts
    ruff format --check python test scripts
    python scripts/sync_version.py --check

[testenv:ruff-check]
basepython = python3
skip_install = true
deps = ruff>=0.6
commands =
    ruff check python test scripts {posargs}

[testenv:ruff-format]
basepython = python3
skip_install = true
deps = ruff>=0.6
commands =
    ruff format python test scripts {posargs}

[testenv:version-sync]
basepython = python3
deps =
skip_install = true
commands =
    python scripts/sync_version.py --check


[testenv:docs]
basepython = python3
extras = docs
commands =
    sphinx-build -E -T -b html doc build/documentation/html

[testenv:serve-docs]
basepython = python3
skip_install = true
changedir = build/documentation/html
commands =
    python -m http.server {posargs}


# Unit tests (CI's build-step equivalent). No integ-tier producers.
[testenv:unit-tests]
basepython = python3
usedevelop = true
extras = test
commands =
    pytest {posargs} \
        test/unit_tests \
        --cov=qirtoqasm --cov-report term-missing \
        --cov-report html --cov-report xml --cov-append \
        --cov-fail-under=100 \
        -p no:anyio


# Q# → QIR → qirtoqasm → Braket. Subprocess-isolated per test case:
# ``qsharp.init`` resets interpreter state process-wide.
[testenv:integ-qsharp]
basepython = python3
usedevelop = true
extras = test,braket,qsharp
commands =
    pytest {posargs} \
        test/integ_tests/test_qsharp_e2e.py \
        -n auto \
        -p no:anyio


# Local wheel-build smoke. CI's release pipeline uses cibuildwheel.
[testenv:build-wheel]
basepython = python3
skip_install = true
deps =
    maturin>=1.5,<2.0
commands =
    python scripts/sync_version.py --check
    maturin build --release --strip --out dist {posargs}

[testenv:twine-check]
basepython = python3
skip_install = true
deps =
    maturin>=1.5,<2.0
    twine>=5.0
commands =
    python scripts/sync_version.py --check
    maturin build --release --strip --out dist
    maturin sdist --out dist
    twine check dist/*
