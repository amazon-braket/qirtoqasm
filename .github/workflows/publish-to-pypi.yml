# Build wheels + sdist and publish to PyPI via trusted publishing (OIDC)
# when a GitHub release is published. The build matrix lives in
# `wheels.yml` and is invoked here via `workflow_call`.
#
# Requires a PyPI trusted publisher for this repo pointed at this workflow
# file and the ``pypi`` environment below. See
# https://docs.pypi.org/trusted-publishers/ for setup.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qirtoqasm
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
