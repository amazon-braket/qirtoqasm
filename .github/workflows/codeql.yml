name: CodeQL

# Advanced setup: replaces GitHub's Default CodeQL configuration so we
# can build the Rust cdylib before CMake / CodeQL trace the C/C++
# compiles. Rust and Python are analyzed in `build-mode: none`
# (source-only, no compile trace); C/C++ uses `build-mode: manual`
# because the Rust cdylib must be built before CMake can link
# against it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly baseline scan.
    - cron: '17 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Rust toolchain
        if: matrix.language == 'c-cpp'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: matrix.language == 'c-cpp'
        uses: Swatinem/rust-cache@v2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # C/C++: cargo produces the FFI cdylib first (CMake targets link
      # against it), then CMake configures + builds both smoke targets
      # while CodeQL traces the compiler invocations.
      - name: Build C/C++ under CodeQL tracer
        if: matrix.language == 'c-cpp'
        run: |
          cargo build --release --locked -p qirtoqasm-ffi
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQIRTOQASM_BUILD_C_TESTS=ON \
            -DQIRTOQASM_BUILD_CPP_TESTS=ON
          cmake --build build --target qirtoqasm_c_smoke qirtoqasm_cpp_smoke

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
