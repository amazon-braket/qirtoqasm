# Main CI pipeline, driven by tox.
#
# build     — cargo build/test, lint, tox unit-tests. No Braket / Q# /
#             CUDA-Q. 3 OS × 3 Py.
# msrv      — rust 1.75 build + test on Ubuntu.
#
# integ-* (braket / qsharp / cudaq / fixture-parity) and the C/C++ smoke jobs
# land alongside the code they exercise.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build tier. No Braket / Q# / CUDA-Q. Every OS × every supported Python.
  build:
    name: Build (${{ matrix.os }} / py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install tox
        run: pip install tox

      # `qirtoqasm-py` is excluded from workspace `default-members` because
      # its pyo3 cdylib needs maturin-supplied link flags. Plain
      # `cargo build` uses the default set; maturin builds the extension.
      - name: cargo build (default members)
        run: cargo build --locked

      - name: cargo test (core + ffi)
        run: cargo test -p qirtoqasm-core -p qirtoqasm-ffi --locked

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: cargo clippy -p qirtoqasm-core -p qirtoqasm-ffi --all-targets -- -D warnings

      - name: Run tox unit-tests
        run: tox -e unit-tests -- -q

      # Emit an abi3 wheel once per OS (py 3.11 is enough — abi3 wheels
      # work across all supported Pythons for the same OS). The integ
      # jobs pick this up via download-artifact so they don't re-invoke
      # maturin from source.
      - name: Build release wheel
        if: matrix.python-version == '3.11'
        run: tox -e build-wheel
      - name: Upload release wheel
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: qirtoqasm-wheel-${{ matrix.os }}
          path: dist/qirtoqasm-*.whl
          if-no-files-found: error
          retention-days: 1

  # MSRV enforcement: the declared `rust-version = 1.85` must still build.
  msrv:
    name: MSRV (rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked
      - name: cargo test (core + ffi)
        run: cargo test -p qirtoqasm-core -p qirtoqasm-ffi --locked

  coverage:
    name: Coverage (qirtoqasm-core ≥ 97 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov (lcov + fail under 97 % lines)
        run: >
          cargo llvm-cov --package qirtoqasm-core
          --ignore-filename-regex '.*test_support\.rs$'
          --fail-under-lines 97
          --lcov --output-path lcov.info
          --locked
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  cpp-smoke:
    name: C++ smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure
        run: cmake -B build -S . -DQIRTOQASM_BUILD_CPP_TESTS=ON
      - name: Build
        run: cmake --build build --target qirtoqasm_cpp_smoke --config Release
      - name: Run
        shell: bash
        run: |
          if [ -x build/qirtoqasm_cpp_smoke ]; then
            ./build/qirtoqasm_cpp_smoke
          else
            ./build/Release/qirtoqasm_cpp_smoke.exe
          fi

  c-smoke:
    name: C smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure
        run: cmake -B build -S . -DQIRTOQASM_BUILD_C_TESTS=ON
      - name: Build
        run: cmake --build build --target qirtoqasm_c_smoke --config Release
      - name: Run
        shell: bash
        run: |
          if [ -x build/qirtoqasm_c_smoke ]; then
            ./build/qirtoqasm_c_smoke
          else
            ./build/Release/qirtoqasm_c_smoke.exe
          fi

  # Byte-exact fixture regression + cross-simulator correctness.
  # Matrix narrowed to 3-OS × 3.13: qirrunner is a native binary whose
  # OS-specific behavior (segfaults, linkage) is in scope for these
  # tests, but Python-version coverage is redundant with `build`.
  integ-fixture-parity:
    name: Integ / Fixture parity (${{ matrix.os }} / py ${{ matrix.python-version }})
    needs: [build, cpp-smoke, c-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download release wheel
        uses: actions/download-artifact@v4
        with:
          name: qirtoqasm-wheel-${{ matrix.os }}
          path: dist
      - name: Install release wheel + integ deps
        shell: bash
        run: |
          pip install "$(ls dist/qirtoqasm-*.whl)[test]"
      - name: Run fixture-parity integ tests
        run: pytest test/integ_tests/test_fixture_parity.py test/integ_tests/test_known_limitations.py -n auto -p no:anyio -q

  # QIR → OpenQASM 3 translation, executed on the Braket LocalSimulator.
  # Matrix narrowed to a single ubuntu × 3.13 cell: Braket LocalSimulator
  # is Python code and cross-Python is covered by the `build` matrix.
  integ-braket:
    name: Integ / Braket (${{ matrix.os }} / py ${{ matrix.python-version }})
    needs: [build, cpp-smoke, c-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download release wheel
        uses: actions/download-artifact@v4
        with:
          name: qirtoqasm-wheel-${{ matrix.os }}
          path: dist
      - name: Install release wheel + integ deps
        shell: bash
        run: |
          pip install "$(ls dist/qirtoqasm-*.whl)[test]"
      - name: Run Braket e2e integ tests
        run: pytest test/integ_tests/test_braket_e2e.py -n auto -p no:anyio -q

  # Q# → QIR → qirtoqasm → Braket, subprocess-isolated per test case.
  integ-qsharp:
    name: Integ / Q# (${{ matrix.os }} / py ${{ matrix.python-version }})
    needs: [build, cpp-smoke, c-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download release wheel
        uses: actions/download-artifact@v4
        with:
          name: qirtoqasm-wheel-${{ matrix.os }}
          path: dist
      - name: Install release wheel + integ deps
        shell: bash
        run: |
          pip install "$(ls dist/qirtoqasm-*.whl)[test,qsharp]"
      - name: Run Q# e2e integ tests
        run: pytest test/integ_tests/test_qsharp_e2e.py -n auto -p no:anyio -q

  # CUDA-Q → QIR → qirtoqasm → Braket. Linux + macOS only — no Windows wheels.
  # Subprocess-isolated per test case: CUDA-Q's MLIR JIT carries process-wide
  # state that breaks on back-to-back kernel compilations.
  # Matrix narrowed to a single ubuntu × 3.13 cell: cross-Python is
  # covered by the `build` matrix; CUDA-Q's QIR emission is
  # platform-invariant modulo the JIT internals we intentionally
  # isolate via subprocess-per-test.
  integ-cudaq:
    name: Integ / CUDA-Q (${{ matrix.os }} / py ${{ matrix.python-version }})
    needs: [build, cpp-smoke, c-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download release wheel
        uses: actions/download-artifact@v4
        with:
          name: qirtoqasm-wheel-${{ matrix.os }}
          path: dist
      - name: Install release wheel + integ deps
        shell: bash
        run: |
          pip install "$(ls dist/qirtoqasm-*.whl)[test,cudaq]"
      - name: Run CUDA-Q e2e integ tests
        run: pytest test/integ_tests/test_cudaq_e2e.py -n auto -p no:anyio -q
