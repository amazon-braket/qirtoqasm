# Build an sdist via maturin and run ``twine check`` on it. Catches
# README-rendering / metadata errors on the PR before they block a
# release.

name: Check long description for PyPI

on:
  pull_request:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  twine-check:
    name: Check long description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.5,<2.0' 'twine>=5.0'

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Check long description
        run: twine check dist/*
