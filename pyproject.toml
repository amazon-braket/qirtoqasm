[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "qirtoqasm"
# Dynamic: maturin reads the version from `Cargo.toml
# [workspace.package].version`, which `scripts/sync_version.py` keeps
# in sync with the authoritative `python/qirtoqasm/_version.py`.
dynamic = ["version"]
description = "Translate QIR (Quantum Intermediate Representation) to Braket-compatible OpenQASM 3.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Amazon Web Services" }]
keywords = ["Amazon", "AWS", "Braket", "Quantum", "QIR", "OpenQASM", "LLVM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
# Zero runtime Python dependencies — the Rust core does everything.
dependencies = []

[project.optional-dependencies]
# Test extras for unit tests and basic integration tests.
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "amazon-braket-sdk>=1.95.0",
    "amazon-braket-default-simulator>=1.32.0",
    "qirrunner>=0.9",
]
# Lint / format / wheel build / release tooling.
dev = [
    "maturin>=1.5,<2.0",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=5.0",
]
# Microsoft Q# → QIR → qirtoqasm → Braket. Linux / macOS / Windows.
qsharp = [
    "qsharp>=1.19",
]
# NVIDIA CUDA-Q → QIR → qirtoqasm → Braket. Linux / macOS only — no
# Windows wheels. Pinned to 0.14.2 — cudaq 0.15.0 has an MLIR JIT
# regression that fails to resolve return-typed kernel thunks
# (`Symbols not found: [_kernel...thunk]`) during `cudaq.run`.
cudaq = [
    "cudaq==0.14.2; sys_platform != 'win32'",
]
# Sphinx documentation build (Read the Docs).
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinxcontrib-apidoc>=0.5",
]

[project.urls]
Homepage = "https://github.com/amazon-braket/qirtoqasm"
Documentation = "https://qirtoqasm.readthedocs.io/"
"Source Code" = "https://github.com/amazon-braket/qirtoqasm"
Issues = "https://github.com/amazon-braket/qirtoqasm/issues"

[tool.maturin]
manifest-path = "crates/qirtoqasm-py/Cargo.toml"
module-name = "qirtoqasm._qirtoqasm_native"
python-source = "python"
features = ["pyo3/extension-module"]
include = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
# ``-p no:anyio`` is load-bearing — anyio's pytest plugin can crash the
# interpreter during error formatting.
testpaths = ["test/unit_tests"]
addopts = "-ra -p no:anyio"
markers = [
    "integ: end-to-end tests needing braket / qsharp / cudaq at runtime (deselect with '-m \"not integ\"')",
]

[tool.coverage.run]
branch = true
source = ["qirtoqasm"]

[tool.coverage.report]
# Python-shim coverage gate is enforced incrementally; this floor is
# raised to 100 once the full PyO3 binding and the comprehensive
# unit-test suite are in place.
fail_under = 0
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "target",
    "build",
    "doc/_build",
    "doc/_apidoc",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CUDA-Q kernel fixtures use gate names (``h``, ``x``, ``mz``, …) as
# bare globals — the cudaq kernel decorator resolves them at compile
# time. Ruff can't see that.
"test/integ_tests/fixtures_cudaq/*.py" = ["F821"]
# Subprocess runners have deferred imports (process isolation) that
# ruff flags as unsorted.
"test/integ_tests/_*_runner.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["qirtoqasm", "_helpers"]
